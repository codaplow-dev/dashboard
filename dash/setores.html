<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setores | Processos</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/setores.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-solid fa-layer-group"></i><span>Setores</span>
        </div>
        <nav class="menu">
          <a href="index.html" class="menu-item"
            ><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a
          ><a href="processos.html" class="menu-item"
            ><i class="fa-solid fa-folder"></i><span>Processos</span></a
          ><a href="usuarios.html" class="menu-item"
            ><i class="fa-solid fa-users"></i><span>Usuários</span></a
          ><a href="setores.html" class="menu-item active"
            ><i class="fa-solid fa-building"></i><span>Setores</span></a
          ><a href="relatorios.html" class="menu-item"
            ><i class="fa-solid fa-chart-pie"></i><span>Relatórios</span></a
          >
        </nav>
        <div class="sidebar-footer">
          <a href="#" class="menu-item"
            ><i class="fa-solid fa-gear"></i><span>Configurações</span></a
          >
        </div>
      </aside>
      <main class="main-content">
        <header class="page-header">
          <div>
            <h1>Setores</h1>
            <p>Organize os setores responsáveis pelos processos.</p>
          </div>
          <button id="newSector" class="primary-button">
            <i class="fa-solid fa-plus"></i>Novo setor
          </button>
        </header>
        <section class="sector-summary">
          <article>
            <span id="sectorCount">0</span><small>Setores cadastrados</small>
          </article>
          <article>
            <span id="sectorProcesses">0</span
            ><small>Processos em andamento</small>
          </article>
          <article>
            <span id="sectorMembers">0</span
            ><small>Colaboradores vinculados</small>
          </article>
        </section>
        <section class="content-card">
          <div class="toolbar">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i
              ><input id="sectorSearch" placeholder="Buscar setor..." />
            </div>
          </div>
          <div id="sectorGrid" class="sector-grid"></div>
        </section>
      </main>
    </div>
    <script src="js/global.js"></script>
    <script src="js/setores.js"></script>
  </body>
</html>
